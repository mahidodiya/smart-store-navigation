databases:
  - name: smart-store-db
    plan: free
    databaseName: smart_store_db
    user: smart_store_user

services:
  - type: web
    name: smart-store-navigation
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-store-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0
    healthCheckPath: /api/health
